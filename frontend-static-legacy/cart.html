<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meera's Tiffin Box — Avika</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="api.js" defer></script>
<style>
  :root{
    --maroon:#7C1B3B; --maroon-dark:#591327; --teal:#1B7A8C; --teal-dark:#135A68;
    --cream:#FBF6EC; --sand:#F1E7D6; --ink:#2B1720; --ink-soft:#6B5A61; --gold:#C4903E;
    --line:rgba(43,23,32,0.12); --radius-lg:22px; --radius-md:14px;
    --font-display:'Fraunces',serif; --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--font-body); background:var(--cream); color:var(--ink); line-height:1.6;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 32px;}
  .logo{display:flex; align-items:center; gap:10px;}
  .logo-word{font-family:var(--font-display); font-weight:700; font-size:22px; color:var(--maroon);}
  header{position:sticky; top:0; z-index:60; background:rgba(251,246,236,0.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
  nav{display:flex; align-items:center; justify-content:space-between; padding:18px 0;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:600; font-size:14px; padding:11px 22px; border-radius:100px; border:1.5px solid transparent; cursor:pointer;}
  .btn-primary{background:var(--maroon); color:#fff;}
  .btn-primary:hover{background:var(--maroon-dark);}
  .btn-primary:disabled{background:var(--ink-soft); cursor:not-allowed;}
  .btn-ghost{border-color:var(--line);}
  .cart-toggle{position:relative; display:flex; align-items:center; gap:8px; background:var(--ink); color:#fff; padding:11px 20px; border-radius:100px; font-weight:600; font-size:14px; cursor:pointer; border:none;}
  .cart-badge{background:var(--gold); color:var(--maroon-dark); font-size:11.5px; font-weight:700; min-width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center;}

  .kitchen-hero{padding:44px 0 28px; border-bottom:1px solid var(--line);}
  .k-title{font-family:var(--font-display); font-weight:600; font-size:32px; margin-bottom:6px;}
  .k-meta{display:flex; gap:18px; font-size:14px; color:var(--ink-soft); flex-wrap:wrap;}
  .k-meta span{display:flex; align-items:center; gap:6px;}

  .menu-section{padding:36px 0 100px;}
  .menu-cat{font-family:var(--font-display); font-size:20px; font-weight:600; margin:32px 0 16px;}
  .menu-cat:first-child{margin-top:0;}
  .menu-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px;}
  .menu-item{
    display:flex; gap:16px; background:#fff; border:1px solid var(--line); border-radius:var(--radius-md);
    padding:16px; align-items:center;
  }
  .menu-thumb{width:64px; height:64px; border-radius:12px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;}
  .menu-thumb svg{width:26px; height:26px;}
  .menu-info h4{font-size:15px; font-weight:600; margin-bottom:3px;}
  .menu-info p{font-size:12.5px; color:var(--ink-soft); margin-bottom:8px;}
  .menu-price{font-weight:600; font-size:14px;}
  .qty-row{display:flex; align-items:center; gap:10px; margin-left:auto;}
  .qty-btn{
    width:28px; height:28px; border-radius:50%; border:1.5px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; font-weight:600; color:var(--maroon);
  }
  .qty-btn:hover{border-color:var(--maroon);}
  .qty-num{min-width:16px; text-align:center; font-weight:600; font-size:14px;}
  .add-btn{
    border:1.5px solid var(--maroon); color:var(--maroon); background:#fff; font-weight:600; font-size:13px;
    padding:7px 16px; border-radius:100px; cursor:pointer; margin-left:auto;
  }
  .add-btn:hover{background:var(--maroon); color:#fff;}

  /* ---- Cart drawer ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(43,23,32,0.35); z-index:70;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; right:0; height:100%; width:400px; max-width:92vw;
    background:var(--cream); z-index:80; box-shadow:-16px 0 40px rgba(43,23,32,0.18);
    display:flex; flex-direction:column; transform:translateX(100%); transition:transform .28s ease;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{display:flex; align-items:center; justify-content:space-between; padding:22px 24px; border-bottom:1px solid var(--line);}
  .drawer-head h3{font-family:var(--font-display); font-size:20px; font-weight:600;}
  .close-btn{width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .drawer-body{flex:1; overflow-y:auto; padding:8px 24px;}
  .cart-line{display:flex; gap:12px; padding:16px 0; border-bottom:1px solid var(--line);}
  .cart-thumb{width:50px; height:50px; border-radius:10px; background:var(--sand); flex:0 0 auto;}
  .cart-line-info{flex:1;}
  .cart-line-info h5{font-size:14px; font-weight:600; margin-bottom:2px;}
  .cart-line-info .price{font-size:13px; color:var(--ink-soft);}
  .cart-line-actions{display:flex; align-items:center; gap:8px;}
  .remove-x{font-size:12px; color:var(--ink-soft); cursor:pointer; margin-left:10px;}
  .remove-x:hover{color:var(--maroon);}
  .empty-cart{padding:60px 12px; text-align:center; color:var(--ink-soft);}
  .empty-cart svg{margin:0 auto 16px;}
  .drawer-foot{border-top:1px solid var(--line); padding:20px 24px 26px;}
  .sum-row{display:flex; justify-content:space-between; font-size:14px; color:var(--ink-soft); margin-bottom:8px;}
  .sum-row.total{font-size:16px; font-weight:600; color:var(--ink); margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
  .drawer-foot .btn{width:100%; margin-top:14px; padding:14px;}

  button:focus-visible, .qty-btn:focus-visible, .add-btn:focus-visible, a:focus-visible{
    outline:2px solid var(--teal); outline-offset:2px;
  }
  .menu-thumb, .cart-thumb{position:relative;}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <nav>
      <a href="index.html" class="logo">
        <svg width="28" height="28" viewBox="0 0 48 48"><path d="M24 4 L42 40 L6 40 Z" fill="#7C1B3B"/><circle cx="24" cy="20" r="6" fill="#FBF6EC"/><path d="M24 26 C24 26 16 30 16 36" stroke="#FBF6EC" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 5"/></svg>
        <span class="logo-word">AVIKA</span>
      </a>
      <button class="cart-toggle" id="cart-toggle" aria-haspopup="dialog" aria-expanded="false" aria-controls="drawer">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.6 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        Your cart
        <span class="cart-badge" id="cart-count" aria-live="polite">0</span>
      </button>
    </nav>
  </div>
</header>

<section class="kitchen-hero">
  <div class="wrap">
    <h1 class="k-title">Meera's Tiffin Box</h1>
    <div class="k-meta">
      <span>★ 4.9 (320 orders)</span>
      <span>South Indian · Home-style thali</span>
      <span>0.8 km · 25–35 min</span>
    </div>
  </div>
</section>

<section class="menu-section">
  <div class="wrap">

    <div id="menu-container"></div>

  </div>
</section>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
  <div class="drawer-head">
    <h3 id="drawer-title">Your cart</h3>
    <button class="close-btn" id="close-drawer" aria-label="Close cart">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2B1720" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot" id="drawer-foot"></div>
</aside>

<script>
  var MENU = [
    { id:'m1', cat:"Today's tiffin", name:'South Indian Thali', desc:'Rice, sambar, rasam, 2 curries, curd, papad', price:150, color:'#7C1B3B', special:true, icon:'<path d="M4 11h16M4 11a4 4 0 0 1 8-3 4 4 0 0 1 8 3M4 11v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/>' },
    { id:'m2', cat:"Today's tiffin", name:'Curd Rice Box', desc:'Fresh curd rice with tempering and pickle', price:90, color:'#7C1B3B', icon:'<path d="M4 11h16M4 11a4 4 0 0 1 8-3 4 4 0 0 1 8 3M4 11v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/>' },
    { id:'m3', cat:"Today's tiffin", name:'Lemon Rice Box', desc:'Tangy lemon rice with peanuts and curry leaves', price:90, color:'#7C1B3B', icon:'<path d="M4 11h16M4 11a4 4 0 0 1 8-3 4 4 0 0 1 8 3M4 11v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/>' },
    { id:'m4', cat:"Today's tiffin", name:'Mini Idli Sambar', desc:'12 mini idlis with sambar and chutney', price:110, color:'#7C1B3B', icon:'<path d="M4 11h16M4 11a4 4 0 0 1 8-3 4 4 0 0 1 8 3M4 11v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/>' },
    { id:'m5', cat:'Sides & extras', name:'Papad (2 pcs)', desc:'Roasted papad', price:20, color:'#C4903E', icon:'<circle cx="12" cy="12" r="8"/>' },
    { id:'m6', cat:'Sides & extras', name:'Buttermilk', desc:'Spiced buttermilk, 250ml', price:30, color:'#C4903E', icon:'<circle cx="12" cy="12" r="8"/>' },
    { id:'m7', cat:'Sides & extras', name:'Payasam Cup', desc:'Semiya payasam, small cup', price:45, color:'#C4903E', icon:'<circle cx="12" cy="12" r="8"/>' }
  ];

  var params = new URLSearchParams(window.location.search);
  var KITCHEN_ID = params.get('kitchenId') || 'demo-kitchen-meeras-tiffin-box';
  if (typeof Avika !== 'undefined') {
    try { localStorage.setItem('avika_active_kitchen', KITCHEN_ID); } catch (e) {}
  }
  var cart = Avika.cart.get()[KITCHEN_ID] || {};

  function fmt(n){ return '\u20B9' + n.toLocaleString('en-IN'); }

  function persistCart(){
    var all = Avika.cart.get();
    all[KITCHEN_ID] = cart;
    Avika.cart.save(all);
  }

  function renderMenu(){
    var container = document.getElementById('menu-container');
    container.innerHTML = '';
    var cats = [];
    MENU.forEach(function(m){ if (cats.indexOf(m.cat) === -1) cats.push(m.cat); });

    cats.forEach(function(cat){
      var catEl = document.createElement('div');
      catEl.className = 'menu-cat';
      catEl.textContent = cat;
      container.appendChild(catEl);

      var grid = document.createElement('div');
      grid.className = 'menu-grid';

      MENU.filter(function(m){ return m.cat === cat; }).forEach(function(item){
        var el = document.createElement('div');
        el.className = 'menu-item';
        el.innerHTML =
          '<div class="menu-thumb" style="background:' + item.color + '1a;"><svg viewBox="0 0 24 24" fill="none" stroke="' + item.color + '" stroke-width="1.8">' + item.icon + '</svg></div>' +
          '<div class="menu-info"><h4>' + item.name + (item.special ? ' <span style="font-size:10.5px;font-weight:700;color:#C4903E;background:rgba(196,144,62,0.15);padding:2px 7px;border-radius:100px;">★ Today\'s special</span>' : '') + '</h4><p>' + item.desc + '</p><div class="menu-price">' + fmt(item.price) + '</div></div>' +
          '<div class="item-action" data-id="' + item.id + '"></div>';
        grid.appendChild(el);
      });
      container.appendChild(grid);
    });

    MENU.forEach(function(item){ renderItemAction(item.id); });
  }

  function renderItemAction(id){
    var slot = document.querySelector('.item-action[data-id="' + id + '"]');
    var qty = cart[id] || 0;
    var item = MENU.find(function(m){ return m.id === id; });
    if (qty === 0){
      slot.innerHTML = '<button class="add-btn" aria-label="Add ' + item.name + ' to cart" onclick="changeQty(\'' + id + '\',1)">Add</button>';
    } else {
      slot.innerHTML =
        '<div class="qty-row" style="margin-left:auto;">' +
          '<button class="qty-btn" aria-label="Remove one ' + item.name + '" onclick="changeQty(\'' + id + '\',-1)">–</button>' +
          '<span class="qty-num" aria-live="polite">' + qty + '</span>' +
          '<button class="qty-btn" aria-label="Add one more ' + item.name + '" onclick="changeQty(\'' + id + '\',1)">+</button>' +
        '</div>';
    }
  }

  function changeQty(id, delta){
    cart[id] = (cart[id] || 0) + delta;
    if (cart[id] <= 0) delete cart[id];
    persistCart();
    renderItemAction(id);
    renderDrawer();
  }

  function cartTotals(){
    var subtotal = 0, count = 0;
    Object.keys(cart).forEach(function(id){
      var item = MENU.find(function(m){ return m.id === id; });
      subtotal += item.price * cart[id];
      count += cart[id];
    });
    var delivery = subtotal > 0 ? (subtotal >= 300 ? 0 : 25) : 0;
    return { subtotal: subtotal, delivery: delivery, total: subtotal + delivery, count: count };
  }

  function renderDrawer(){
    var t = cartTotals();
    document.getElementById('cart-count').textContent = t.count;
    var body = document.getElementById('drawer-body');
    var foot = document.getElementById('drawer-foot');

    if (t.count === 0){
      body.innerHTML =
        '<div class="empty-cart">' +
          '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#6B5A61" stroke-width="1.6"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.6 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>' +
          '<p>Your cart is empty.<br>Add something from Meera\'s menu.</p>' +
        '</div>';
      foot.innerHTML = '<button class="btn btn-primary" disabled>Add items to continue</button>';
      return;
    }

    body.innerHTML = '';
    Object.keys(cart).forEach(function(id){
      var item = MENU.find(function(m){ return m.id === id; });
      var qty = cart[id];
      var row = document.createElement('div');
      row.className = 'cart-line';
      row.innerHTML =
        '<div class="cart-thumb"></div>' +
        '<div class="cart-line-info">' +
          '<h5>' + item.name + '</h5>' +
          '<div class="price">' + fmt(item.price) + ' each</div>' +
          '<div class="cart-line-actions" style="margin-top:8px;">' +
            '<button class="qty-btn" onclick="changeQty(\'' + id + '\',-1)">–</button>' +
            '<span class="qty-num">' + qty + '</span>' +
            '<button class="qty-btn" onclick="changeQty(\'' + id + '\',1)">+</button>' +
            '<span class="remove-x" onclick="cart[\'' + id + '\']=0; changeQty(\'' + id + '\',0)">Remove</span>' +
          '</div>' +
        '</div>';
      body.appendChild(row);
    });

    foot.innerHTML =
      '<div class="sum-row"><span>Subtotal</span><span>' + fmt(t.subtotal) + '</span></div>' +
      '<div class="sum-row"><span>Delivery fee</span><span>' + (t.delivery === 0 ? 'Free' : fmt(t.delivery)) + '</span></div>' +
      '<div class="sum-row total"><span>Total</span><span>' + fmt(t.total) + '</span></div>' +
      '<a href="checkout.html" class="btn btn-primary" style="text-decoration:none;">Go to checkout</a>';
  }

  document.getElementById('cart-toggle').addEventListener('click', function(){
    document.getElementById('drawer').classList.add('open');
    document.getElementById('overlay').classList.add('open');
    document.getElementById('cart-toggle').setAttribute('aria-expanded', 'true');
    document.getElementById('close-drawer').focus();
  });
  function closeDrawer(){
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('cart-toggle').setAttribute('aria-expanded', 'false');
    document.getElementById('cart-toggle').focus();
  }
  document.getElementById('close-drawer').addEventListener('click', closeDrawer);
  document.getElementById('overlay').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && document.getElementById('drawer').classList.contains('open')) closeDrawer();
  });

  // Try to load the real menu from the API; silently keep the static MENU
  // above if the backend isn't running — this page still works standalone.
  async function tryLoadLiveMenu(){
    if (typeof Avika === 'undefined') return;
    var result = await Avika.kitchens.menu(KITCHEN_ID);
    if (result.ok && result.data && result.data.length){
      MENU = result.data.map(function(item){
        return {
          id: item._id, cat: item.category, name: item.name, desc: item.description || '',
          price: item.price, color: item.isSpecial ? '#C4903E' : '#7C1B3B',
          special: !!item.isSpecial,
          icon: '<path d="M4 11h16M4 11a4 4 0 0 1 8-3 4 4 0 0 1 8 3M4 11v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/>'
        };
      });
      cart = {};
      renderMenu();
      renderDrawer();
    }
    var kRes = await Avika.kitchens.get(KITCHEN_ID);
    if (kRes.ok){
      document.querySelector('.k-title').textContent = kRes.data.name;
      var hours = (kRes.data.operatingHours && kRes.data.operatingHours[0])
        ? kRes.data.operatingHours[0].openTime + '–' + kRes.data.operatingHours[0].closeTime : null;
      document.querySelector('.k-meta').innerHTML =
        '<span>★ ' + (kRes.data.rating || '—') + '</span>' +
        '<span>' + (kRes.data.cuisine || []).join(', ') + '</span>' +
        (hours ? '<span>Open ' + hours + '</span>' : '');
    }
  }

  renderMenu();
  renderDrawer();
  changeQty('m1', 2);
  tryLoadLiveMenu();
</script>
</body>
</html>
